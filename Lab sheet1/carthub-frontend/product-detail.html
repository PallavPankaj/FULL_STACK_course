<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CartHub - Product Details</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <span class="logo-icon">🛒</span>
            <span>CartHub</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <section class="product-detail">

            <!-- Product Image -->
            <div class="product-image">
                <img src="https://via.placeholder.com/400" alt="Wireless Headphones">
            </div>


            <!-- Product Information -->
            <div class="product-info">

                <h2>Wireless Headphones</h2>

                <p class="price">₹1,499</p>

                <p>
                    Experience high-quality sound with these wireless
                    headphones. They are comfortable, lightweight and
                    perfect for music, movies and online classes.
                </p>

                <!-- Quantity -->
                <label for="quantity">Quantity:</label>

                <select id="quantity" name="quantity">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <br><br>

                <button>Add to Cart</button>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>Contact: support@carthub.com</p>
        <p>&copy; 2026 CartHub. All Rights Reserved.</p>
    </footer>

</body>

</html>
