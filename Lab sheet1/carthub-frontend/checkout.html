<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CartHub - Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <span class="logo-icon">🛒</span>
            <span>CartHub</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <section class="checkout-section">

            <h2>Checkout</h2>

            <form>

                <!-- Name -->
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>


                <!-- Address -->
                <label for="address">Address:</label>
                <textarea id="address" name="address" placeholder="Enter your address" rows="4" required></textarea>


                <!-- City -->
                <label for="city">City:</label>
                <input type="text" id="city" name="city" placeholder="Enter your city" required>


                <!-- Pincode -->
                <label for="pincode">Pincode:</label>
                <input type="text" id="pincode" name="pincode" placeholder="Enter your pincode" required>


                <!-- Phone -->
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>


                <!-- Payment Method -->
                <fieldset>

                    <legend>Payment Method:</legend>

                    <label>
                        <input type="radio" name="payment" value="cod" required>
                        Cash on Delivery
                    </label>

                    <label>
                        <input type="radio" name="payment" value="upi">
                        UPI
                    </label>

                    <label>
                        <input type="radio" name="payment" value="card">
                        Credit/Debit Card
                    </label>

                </fieldset>


                <!-- Place Order -->
                <button type="submit">Place Order</button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>Contact: support@carthub.com</p>
        <p>&copy; 2026 CartHub. All Rights Reserved.</p>
    </footer>

</body>

</html>
